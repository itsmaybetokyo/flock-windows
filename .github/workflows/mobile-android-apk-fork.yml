name: Mobile Android APK (Fork)

# Builds a Flock-branded Android APK on a GitHub runner and signs it with the
# fork's release keystore, so the result installs like any store app.
#
# Play App Signing keys live inside Google and cannot be used here, so this is
# the fork's own key. An APK signed with it cannot update a T3 Code installed
# from Play: uninstall that app first, or install on a device that never had it.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: App variant
        type: choice
        options:
          - production
          - preview
          - development
        default: production
      abi:
        description: Android ABI
        type: choice
        options:
          - arm64-v8a
          - arm64-v8a,x86_64
          - all
        default: arm64-v8a
  workflow_call:
    inputs:
      variant:
        description: App variant
        type: string
        required: false
        default: production
      abi:
        description: Android ABI
        type: string
        required: false
        default: arm64-v8a
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

concurrency:
  group: mobile-android-apk-fork-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: APK (${{ inputs.variant || 'production' }}, ${{ inputs.abi || 'arm64-v8a' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      APP_VARIANT: ${{ inputs.variant || 'production' }}
      EXPO_NO_GIT_STATUS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      # Public identifiers only, copied from .env.example so the fork build keeps
      # T3 Connect working without storing secrets.
      - name: Resolve public config
        shell: bash
        run: |
          set -euo pipefail
          value() {
            local found
            found="$(sed -n "s/^$1=//p" .env.example | head -n 1)"
            if [[ -z "$found" ]]; then
              echo ".env.example is missing $1" >&2
              exit 1
            fi
            printf '%s' "$found"
          }
          {
            echo "T3CODE_CLERK_PUBLISHABLE_KEY=$(value T3CODE_CLERK_PUBLISHABLE_KEY)"
            echo "T3CODE_CLERK_JWT_TEMPLATE=$(value T3CODE_CLERK_JWT_TEMPLATE)"
            echo "T3CODE_RELAY_URL=$(value T3CODE_RELAY_URL)"
          } >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.abi || 'arm64-v8a' }}

      - name: Generate Android project
        working-directory: apps/mobile
        run: vp exec expo prebuild --platform android --no-install --clean

      - name: Remove release signing
        run: node .github/scripts/patch-android-unsigned-release.mjs

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false
        run: |
          set -euo pipefail
          args=(app:assembleRelease --no-daemon --stacktrace)
          if [[ "${{ inputs.abi || 'arm64-v8a' }}" != "all" ]]; then
            args+=("-PreactNativeArchitectures=${{ inputs.abi || 'arm64-v8a' }}")
          fi
          ./gradlew "${args[@]}"

      # Gradle's release output is unsigned here (see the step above), so align
      # and sign it with the fork keystore before it goes anywhere.
      - name: Sign the APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to publish an APK that cannot be installed."
            exit 1
          fi
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          mkdir -p signing artifacts
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
          unsigned="apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$build_tools/zipalign" -f -p 4 "$unsigned" signing/aligned.apk
          "$build_tools/apksigner" sign \
            --ks signing/release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out artifacts/flock-android.apk \
            signing/aligned.apk
          "$build_tools/apksigner" verify --print-certs artifacts/flock-android.apk
          rm -rf signing

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/flock-android.apk
          cd artifacts
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: flock-android-${{ inputs.variant || 'production' }}-signed
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
