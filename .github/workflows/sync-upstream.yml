name: Sync upstream

# This repo is a fork of a fork: seatedro/t3code is the upstream we follow.
# Every run fast-forwards `main` to upstream and merges upstream's
# `rohit/changes` into ours. A push to `rohit/changes` then triggers the
# Windows release build.
#
# Conflicts are resolved per path, never with a merge strategy option: `-X
# ours` answered every conflict the same way, so a file the fork never meant
# to change stayed at whatever copy an older merge left behind. That drift is
# what eventually dropped upstream's SemanticDiffError exports and broke the
# bundle. Only FORK_PATHS keep the fork's side; everything else takes
# upstream. The validate step then refuses to push a tree that still has
# duplicate YAML keys, conflict markers, or a package.json missing something
# upstream declares.
#
# Dependency manifests and pnpm-workspace.yaml are deliberately not fork-owned.
# Keeping the fork's whole file is how upstream's new dependencies and exports
# went missing, and the sync then refused to push for days. They take upstream's
# side and .github/scripts/reconcile-fork-manifests.py merges the fork's own
# entries back, key by key.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      UPSTREAM: seatedro/t3code
      BRANCH: rohit/changes
      # fork-release.yml calls release-desktop.yml, so both stay enabled. The
      # fork's own workflows must be listed too: this step disables everything
      # else, which is how the fork's mobile previews kept getting switched off.
      KEEP: >-
        .github/workflows/sync-upstream.yml
        .github/workflows/fork-release.yml
        .github/workflows/release-desktop.yml
        .github/workflows/mobile-android-apk-fork.yml
        .github/workflows/mobile-eas-preview-fork.yml
    steps:
      - name: Disable upstream workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: &disable |
          gh workflow list --repo "$REPO" --all --json id,path,state \
            --jq '(env.KEEP | split(" ")) as $keep | .[] | select(.state == "active" and (.path | IN($keep[]) | not)) | .id' |
            xargs -r -n1 gh workflow disable --repo "$REPO"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          # SYNC_TOKEN carries the `workflow` scope a merge of upstream
          # workflow files needs, which the default token lacks.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Fast-forward main from upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: gh repo sync "$REPO" --branch main --source "$UPSTREAM"

      - name: Merge upstream into the fork branch
        id: merge
        env:
          # The paths this fork owns. A conflicting hunk here keeps the fork's
          # version; every other conflicting hunk takes upstream. Only add a
          # path after checking the fork really needs to diverge in it.
          FORK_PATHS: |
            .github/workflows/fork-release.yml
            .github/workflows/release-desktop.yml
            .github/workflows/sync-upstream.yml
            assets/flock/
            apps/desktop/src/app/DesktopEnvironment.ts
            apps/mobile/src/features/settings/environment-maintenance.test.ts
            apps/server/src/cli/update.test.ts
            apps/server/src/mcp/OrchestratorMcpService.test.ts
            apps/server/src/provider/agentContextBudget.json
            apps/server/src/scheduledTasks/ScheduledTaskService.test.ts
            apps/web/src/components/T3Wordmark.tsx
            apps/web/src/components/sidebar/UpdateEverythingDialog.tsx
            apps/web/src/state/npmRelease.test.ts
            apps/web/src/state/npmRelease.ts
            packages/shared/src/cliRelease.ts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM.git" || true
          git fetch --no-tags upstream "$BRANCH"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with $UPSTREAM $BRANCH."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          is_fork_path() {
            local path="$1" owned
            while IFS= read -r owned; do
              [ -z "$owned" ] && continue
              if [ "${owned%/}" != "$owned" ]; then
                [[ "$path" == "$owned"* ]] && return 0
              else
                [[ "$path" == "$owned" ]] && return 0
              fi
            done <<< "$FORK_PATHS"
            return 1
          }

          # Resolve one side of a path, including the add/delete cases where
          # that side has no blob: stage 2 is ours, stage 3 is theirs.
          take_side() {
            local side="$1" path="$2" stage=2
            [ "$side" = theirs ] && stage=3
            if git cat-file -e ":$stage:$path" 2>/dev/null; then
              git checkout --"$side" -- "$path"
              git add -- "$path"
            else
              git rm -q -f -- "$path" 2>/dev/null || true
            fi
          }

          git merge --no-commit --no-ff FETCH_HEAD || true
          git ls-files -u | cut -f2 | sort -u > /tmp/conflicts
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if is_fork_path "$path"; then
              echo "conflict (fork): $path"
              take_side ours "$path"
            else
              echo "conflict (upstream): $path"
              take_side theirs "$path"
            fi
          done < /tmp/conflicts

          # Upstream-owned files that carry fork additions: keep upstream's copy
          # and merge the fork's extra entries back, key by key.
          grep -E '(^|/)package\.json$|^apps/mobile/app\.config\.ts$' /tmp/conflicts \
            | xargs -r python3 .github/scripts/reconcile-fork-manifests.py

          git commit --no-edit -q
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git log --oneline -1

      # A bad merge would break the release pipeline silently, so refuse to
      # push one. Duplicate YAML keys are the failure this guard exists for:
      # two catalog blocks parse as "last one wins" and pnpm then cannot read
      # the workspace at all.
      - name: Validate the merged tree
        if: steps.merge.outputs.changed == 'true'
        run: |
          python3 - <<'PY'
          import glob, json, subprocess, sys, yaml

          def walk(node, path):
              if isinstance(node, yaml.MappingNode):
                  seen = set()
                  for key_node, value_node in node.value:
                      if isinstance(key_node, yaml.ScalarNode):
                          key = key_node.value
                          if key in seen:
                              line = key_node.start_mark.line + 1
                              sys.exit(f"{path}:{line}: duplicate key {key!r}")
                          seen.add(key)
                      walk(value_node, path)
              elif isinstance(node, yaml.SequenceNode):
                  for item in node.value:
                      walk(item, path)

          for path in sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml") + glob.glob("*.yml") + glob.glob("*.yaml")):
              with open(path, encoding="utf-8") as handle:
                  try:
                      for document in yaml.compose_all(handle.read()):
                          walk(document, path)
                  except yaml.YAMLError as error:
                      sys.exit(f"{path}: {error}")
          print("YAML OK: no duplicate keys")

          tracked = subprocess.run(["git", "ls-files", "-z"], check=True, capture_output=True).stdout
          marked = []
          for raw in tracked.split(b"\0"):
              if not raw:
                  continue
              path = raw.decode()
              try:
                  with open(path, encoding="utf-8", errors="ignore") as handle:
                      text = handle.read()
              except OSError:
                  continue
              if "\n<<<<<<< " in "\n" + text or "\n>>>>>>> " in "\n" + text:
                  marked.append(path)
          if marked:
              sys.exit("conflict markers left in: " + ", ".join(marked))
          print("OK: no conflict markers")

          upstream = "FETCH_HEAD"
          listing = subprocess.run(["git", "ls-tree", "-r", "--name-only", upstream], check=True, capture_output=True).stdout.decode()
          problems = []
          for path in listing.splitlines():
              if not (path == "package.json" or path.startswith(("apps/", "packages/"))):
                  continue
              if path != "package.json" and not path.endswith("/package.json"):
                  continue
              theirs = json.loads(subprocess.run(["git", "show", f"{upstream}:{path}"], check=True, capture_output=True).stdout)
              try:
                  with open(path, encoding="utf-8") as handle:
                      ours = json.load(handle)
              except FileNotFoundError:
                  problems.append(f"{path}: removed, upstream still has it")
                  continue
              for field in ("dependencies", "devDependencies", "peerDependencies", "optionalDependencies", "exports"):
                  for key in (theirs.get(field) or {}):
                      if key not in (ours.get(field) or {}):
                          problems.append(f"{path} {field}: missing {key!r}")
          if problems:
              sys.exit("package.json is missing upstream entries:\n" + "\n".join(problems))
          print("OK: every package.json is a superset of upstream")
          PY

      - name: Push the synced branch
        if: steps.merge.outputs.changed == 'true'
        run: git push origin "HEAD:${{ env.BRANCH }}"

      - name: Disable newly added upstream workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: *disable
